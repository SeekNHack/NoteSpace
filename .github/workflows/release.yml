name: Release NoteSpace
# Pushing a tag such as v1.0.0 builds the VSIX in CI and attaches it to a GitHub Release.
# VSIX files are never committed to the repository.
# Visual Studio Marketplace: add a repository secret VSCE_PAT (a personal access token of the
# publisher named in package.json) and the same run also publishes there; without it the step is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      # Keep files byte-for-byte (Windows runners convert line endings by default).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit:ci
      # The PDF export test prints with a real Chromium.
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chromium for the PDF export test
        run: npx playwright-core install${{ runner.os == 'Linux' && ' --with-deps' || '' }} chromium
      - name: Extension host tests
        run: xvfb-run -a npm run test:integration
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }
      - run: npm run package
      - name: GitHub Release with the VSIX
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "${GITHUB_REF_NAME}" *.vsix --title "NoteSpace ${GITHUB_REF_NAME}" --notes "$notes"
      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT != ''
        run: npx vsce publish --packagePath *.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: notespace-vsix
          path: '*.vsix'
