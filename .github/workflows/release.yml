name: Release NoteSpace
# Pushing a tag such as v1.0.0 builds the VSIX in CI and attaches it to a GitHub Release.
# VSIX files are never committed to the repository.
# Visual Studio Marketplace: add a repository secret VSCE_PAT (a personal access token of the
# publisher named in package.json) and the same run also publishes there; without it the step is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      # Keep files byte-for-byte (Windows runners convert line endings by default).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit:ci
      # The PDF export test prints with a real Chromium.
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chromium for the PDF export test
        run: npx playwright-core install${{ runner.os == 'Linux' && ' --with-deps' || '' }} chromium
      - name: Extension host tests
        run: xvfb-run -a npm run test:integration
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }
      - run: npm run package
      - name: GitHub Release with the VSIX
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 | sed '/./,$!d')
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # The tag was moved to a new commit: replace the package and notes of the same release.
            # Packages from the previous build of this release (possibly under another name) go first.
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep '\.vsix$' | while read -r old; do
              gh release delete-asset "${GITHUB_REF_NAME}" "$old" --yes
            done
            gh release upload "${GITHUB_REF_NAME}" *.vsix --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "NoteSpace ${GITHUB_REF_NAME}" --notes "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" *.vsix --title "NoteSpace ${GITHUB_REF_NAME}" --notes "$notes"
          fi
      - name: Marketplace token configured?
        if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT == ''
        run: echo "::notice title=Marketplace::No VSCE_PAT secret, the Marketplace publish step is skipped."
      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/') && env.VSCE_PAT != ''
        # vsce reads the token from VSCE_PAT. Its messages also become annotations, so a rejection
        # by the Marketplace can be read on the run page.
        run: |
          set -o pipefail
          if ! npx vsce publish --packagePath *.vsix 2>&1 | tee publish.log; then
            msg=$(tail -c 1500 publish.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Marketplace publish failed::${msg}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notespace-vsix
          path: '*.vsix'
